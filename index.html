<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>👍</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(120deg, #ff0080, #7928ca, #00c6ff, #00ff87, #ffeb3b, #ff0080);
        background-size: 400% 400%;
        animation: hue 8s ease infinite;
      }

      @keyframes hue {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      img { width: min(50vw, 50vh); }

      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <img src="thumbs-up.svg" alt="Thumbs up">
  </body>
</html>
