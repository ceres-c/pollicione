<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>👍</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: hsl(0, 85%, 70%);
        animation: hue 20s linear infinite;
      }

      @keyframes hue {
        to { filter: hue-rotate(360deg); }
      }

      img { width: min(50vw, 50vh); }

      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <img src="thumbs-up.svg" alt="Thumbs up">
  </body>
</html>
